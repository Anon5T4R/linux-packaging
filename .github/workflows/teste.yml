name: Teste do fix-appimage

# Roda a action contra AppImages REAIS ja publicados da suite — um Tauri e um
# Electron. Os dois empacotadores produzem AppDirs diferentes, e a diferenca
# entre eles ja quebrou esta action uma vez (ver o passo do ANGLE la embaixo).
#
# Isto existe porque o bug original era invisivel no CI: o runner e Ubuntu, e o
# problema so aparece em distro com Mesa mais novo. Nao da pra testar aqui se a
# janela abre — mas da pra testar tudo que leva ate ela.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: TaylorHub
            stack: tauri
          - repo: OpenObsidian
            stack: electron

    steps:
      - uses: actions/checkout@v5

      - name: Baixar AppImage real de ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fixture
          gh release download --repo "Anon5T4R/${{ matrix.repo }}" \
            --pattern '*.AppImage' --dir fixture
          ls -lh fixture/

      - name: Rodar a action
        uses: ./fix-appimage
        with:
          path: fixture

      - name: Conferir o resultado
        run: |
          set -euo pipefail
          img="$(ls fixture/*.AppImage | head -1)"
          echo "conferindo $img"

          # 1) O runtime novo nao pode pedir libfuse.so.2 — era o motivo do app
          #    nao abrir em Arch/Fedora.
          if head -c 200000 "$img" | grep -qa 'libfuse\.so\.2'; then
            echo "::error::ainda referencia libfuse.so.2"; exit 1
          fi
          echo "ok: nao depende de libfuse.so.2"

          # 2) Tem que continuar sendo um AppImage que abre e extrai.
          chmod +x "$img"
          ( cd fixture && "./$(basename "$img")" --appimage-extract >/dev/null )
          appdir=fixture/squashfs-root
          [ -d "$appdir" ] || { echo "::error::nao extraiu"; exit 1; }
          echo "ok: extrai normalmente"

          # 3) O binario principal e o AppRun tem que ter sobrevivido.
          [ -e "$appdir/AppRun" ] || { echo "::error::AppRun sumiu"; exit 1; }
          ls "$appdir"/*.desktop >/dev/null || { echo "::error::.desktop sumiu"; exit 1; }
          echo "ok: AppRun e .desktop presentes"

          # 4) Nenhuma lib de host versionada pode ter ficado.
          sobrou="$(find "$appdir" -type f \
            \( -name 'libwayland-*.so.*' -o -name 'libEGL.so.*' \
               -o -name 'libGL.so.*' -o -name 'libgbm.so.*' \
               -o -name 'libvulkan.so.*' \) | head -5)"
          if [ -n "$sobrou" ]; then
            echo "::error::lib de host ficou no AppDir:"; echo "$sobrou"; exit 1
          fi
          echo "ok: nenhuma lib de host versionada no AppDir"

      # ---------------------------------------------------------------------
      # REGRESSAO ESPECIFICA DO ELECTRON.
      #
      # O Electron embarca o ANGLE do Chromium como `libEGL.so` e
      # `libGLESv2.so`, SEM sufixo de versao. Nao sao copias do Mesa. Um glob
      # `libEGL.so*` apaga as duas e derruba o processo de GPU:
      #   Failed to load GLES library: libGLESv2.so: cannot open shared object
      #   Exiting GPU process due to errors during initialization
      #
      # Aconteceu de verdade com o OpenObsidian. Este passo existe pra que a
      # proxima pessoa que ampliar a lista de remocao descubra pelo CI, e nao
      # por um usuario abrindo issue.
      # ---------------------------------------------------------------------
      - name: ANGLE do Electron tem que sobreviver
        if: matrix.stack == 'electron'
        run: |
          set -euo pipefail
          appdir=fixture/squashfs-root
          falta=0
          for lib in libEGL.so libGLESv2.so; do
            if find "$appdir" -type f -name "$lib" | grep -q .; then
              echo "ok: $lib preservada"
            else
              echo "::error::$lib foi removida — o processo de GPU do Electron nao sobe sem ela"
              falta=1
            fi
          done
          exit $falta

  # ---------------------------------------------------------------------------
  # arch-package: repack de .deb em .pkg.tar.zst.
  #
  # O teste que importa aqui NAO e "gerou o arquivo" — e "o pacman aceita
  # instalar". Um pkgname mal formado, um `depends` com nome que nao existe no
  # Arch ou um conflito de arquivo so aparecem na hora do `pacman -U`, e ai
  # apareceriam na maquina do usuario. A traducao de dependencias Debian->Arch e
  # uma TABELA escrita a mao (ver deb-to-arch.sh): tabela sem teste apodrece.
  # ---------------------------------------------------------------------------
  testar-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri simples: binario `hub`, que colide com extra/hub.
          - repo: TaylorHub
            caso: tauri
            system_bins: ''
          # Tauri com SIDECAR: leva /usr/bin/pandoc, que colide com extra/pandoc.
          - repo: LocalOffice
            caso: sidecar
            system_bins: 'pandoc'
          # Electron: instala tudo em /opt e NADA em /usr/bin — o Hub descobre o
          # executavel por `pacman -Ql` e ficaria sem nada pra abrir.
          - repo: OpenObsidian
            caso: electron
            system_bins: ''
    steps:
      - uses: actions/checkout@v5

      - name: Baixar .deb real de ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fixture-deb
          gh release download --repo "Anon5T4R/${{ matrix.repo }}" \
            --pattern '*.deb' --dir fixture-deb
          ls -lh fixture-deb/

      - name: Rodar a action
        id: arch
        uses: ./arch-package
        with:
          deb: fixture-deb
          out: saida-arch
          license: MIT
          description: ${{ matrix.repo }} - teste de empacotamento
          system-bins: ${{ matrix.system_bins }}

      - name: O pacman tem que ACEITAR instalar
        env:
          CASO: ${{ matrix.caso }}
        run: |
          set -euo pipefail
          pkg="${{ steps.arch.outputs.package }}"
          [ -n "$pkg" ] && [ -f "$pkg" ] || { echo "::error::action nao devolveu o pacote"; exit 1; }
          echo "instalando $pkg num Arch limpo (caso: $CASO)"

          # `-Syu` antes: o Arch e rolling e instalar sobre um indice velho da o
          # classico "package not found", que leria como erro do nosso pacote.
          docker run --rm -e CASO -v "$PWD:/w" -w /w archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null

            # O nome do pacote sai do PROPRIO arquivo. Adivinhar (grep por
            # "taylor") so funcionava pra um dos casos.
            nome="$(pacman -Qp --noconfirm "'"$pkg"'" | awk "{print \$1}")"
            echo "pacote: $nome"
            pacman -U --noconfirm "'"$pkg"'"
            pacman -Qi "$nome" | head -14

            # --- contrato comum a todo pacote da suite -----------------------
            # Nao assumir o NOME do binario: ele vem do [package].name do Cargo,
            # que nao acompanha o nome do app (o TaylorHub instala /usr/bin/hub).
            mapfile -t bins < <(pacman -Ql "$nome" | awk "{print \$2}" \
              | grep -E "^/usr/bin/.+" | while read -r f; do [ -x "$f" ] && echo "$f"; done)
            echo "executaveis em /usr/bin: ${bins[*]:-(nenhum)}"
            [ "${#bins[@]}" -ge 1 ] || { echo "::error::nenhum executavel em /usr/bin — o Hub nao acha o que abrir"; exit 1; }
            pacman -Ql "$nome" | grep -q "/usr/share/applications/.*\.desktop" \
              || { echo "::error::pacote sem entrada .desktop"; exit 1; }

            case "$CASO" in
              tauri)
                # REGRESSAO: `hub` colide com extra/hub. Se voltar, o pacote
                # quebra em toda maquina que tenha aquele pacote.
                pacman -Ql "$nome" | grep -qE " /usr/bin/hub$" \
                  && { echo "::error::voltou a instalar /usr/bin/hub"; exit 1; }
                test -x /usr/bin/taylor-hub || { echo "::error::esperava /usr/bin/taylor-hub"; exit 1; }
                d="$(pacman -Ql "$nome" | awk "{print \$2}" | grep "\.desktop$" | head -1)"
                grep -qE "^Exec=taylor-hub" "$d" || { echo "::error::Exec nao acompanhou o rename"; grep ^Exec= "$d"; exit 1; }

                # REGRESSAO: o StartupWMClass e o que o GNOME usa pra casar a
                # JANELA com a entrada .desktop e pegar o icone do dock. O
                # app_id da janela sai do basename do binario, entao renomear
                # sem mexer aqui deixa o app abrindo com icone generico no dock
                # — sem erro nenhum, so feio. Foi o que aconteceu.
                grep -qE "^StartupWMClass=taylor-hub\$" "$d" || {
                  echo "::error::StartupWMClass nao acompanhou o rename do binario"
                  grep -E "^(Exec|StartupWMClass)=" "$d"; exit 1; }
                echo "ok: StartupWMClass casa com o binario"
                ;;
              sidecar)
                # O pandoc embutido tem que ter saido do pacote e virado depends:
                # /usr/bin/pandoc e do pacote `pandoc` do Arch, e conflitaria.
                pacman -Ql "$nome" | grep -qE " /usr/bin/pandoc$" \
                  && { echo "::error::/usr/bin/pandoc continua no pacote — conflita com extra/pandoc"; exit 1; }
                pacman -Qi "$nome" | grep -E "^Depends On" | grep -q pandoc \
                  || { echo "::error::pandoc saiu do pacote mas NAO virou dependencia — o sidecar nao seria achado"; exit 1; }
                # E o pandoc do sistema tem que cair no MESMO caminho que o
                # sidecar do Tauri procura (ao lado do executavel, /usr/bin).
                pacman -S --noconfirm pandoc >/dev/null 2>&1 || pacman -S --noconfirm pandoc-cli >/dev/null 2>&1 || true
                test -e /usr/bin/pandoc || { echo "::error::pandoc do sistema nao caiu em /usr/bin"; exit 1; }
                echo "ok: sidecar resolvido pelo pacote do sistema"
                ;;
              electron)
                # O .deb do electron-builder poe tudo em /opt e nada em /usr/bin.
                # Sem o symlink, o Hub nao tem o que abrir.
                alvo="$(readlink -f "${bins[0]}")"
                echo "ponto de entrada: ${bins[0]} -> $alvo"
                case "$alvo" in /opt/*) : ;; *) echo "::error::esperava symlink pra /opt"; exit 1 ;; esac
                test -x "$alvo" || { echo "::error::alvo do symlink nao e executavel"; exit 1; }
                ;;
            esac
            echo "ok: caso $CASO validado"
          '
